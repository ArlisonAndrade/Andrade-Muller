# n8n na VPS Hostinger (srv1913873) — arquivo completo do painel.
#
# Substitui a versão que dependia do Traefik: a VPS não tem Traefik instalado,
# então as labels `traefik.*` não roteavam nada e ninguém atendia em 443.
# O Caddy faz o mesmo papel e emite o certificado sozinho.
#
# O volume continua se chamando `n8n_data` de propósito — é onde estão os
# workflows e as credenciais já criadas. Renomear apagaria tudo.

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    expose:
      - "5678"
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      - N8N_SECURE_COOKIE=true
      - NODE_ENV=production
      - N8N_HOST=n8n-dmu8.srv1913873.hstgr.cloud
      - WEBHOOK_URL=https://n8n-dmu8.srv1913873.hstgr.cloud/
      - N8N_PROTOCOL=https
      - N8N_PROXY_HOPS=1
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
    volumes:
      - n8n_data:/home/node/.n8n

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from n8n-dmu8.srv1913873.hstgr.cloud --to n8n:5678
    volumes:
      - caddy_data:/data
    depends_on:
      - n8n

volumes:
  n8n_data:
  caddy_data:
